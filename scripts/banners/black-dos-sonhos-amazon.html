<!doctype html>
<html><head><meta charset="utf-8">
<!-- Banner "Black dos Sonhos" (promoção da Amazon, Black Friday 2026). Arte própria:
     céu noturno, prêmio em dourado e laranja da campanha; sem logo nem foto da Amazon.
     Layout v2 (13/11, pedido do Ivan): "Black dos Sonhos" CENTRALIZADO no topo, prêmio embaixo,
     cupons desenhados nas laterais (zoom alternado + brilho), cupons pequenos subindo pelo fundo
     e raios dourados girando atrás do título (mesma linguagem do banner animado da Shopee).
     Computador: 2400×600 (sai 1200×300). Celular: ?m=1 → 1440×480 (sai 720×240).
     Laço de 4 s sem emenda (render-anim.mjs congela as animações quadro a quadro). -->
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:#0b0f19}
body{font-family:'Baloo 2',sans-serif;color:#fff}
.b{position:relative;overflow:hidden;width:2400px;height:600px;
  background:radial-gradient(ellipse 55% 95% at 50% 40%,#2c3758 0%,#161d2d 55%,#0b0f19 100%)}
.m .b{width:1440px;height:480px}

/* ---------- fundo animado ---------- */
/* raios dourados girando atrás do título (1 período do padrão = 20deg por volta → sem emenda) */
.rays{position:absolute;left:1200px;top:250px;width:3400px;height:3400px;margin:-1700px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,200,70,.10) 0 8deg,transparent 8deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 0,#000 22%,transparent 46%);mask:radial-gradient(circle,#000 0,#000 22%,transparent 46%)}
@keyframes rays{from{transform:rotate(0)}to{transform:rotate(20deg)}}
.rays{animation:rays 4s linear infinite}
.glow{position:absolute;left:700px;top:-120px;width:1000px;height:700px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,150,40,.28),transparent 62%)}
@keyframes glow{0%,100%{opacity:.7}50%{opacity:1}}
.glow{animation:glow 4s ease-in-out infinite}

/* nuvens */
.cloud{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 55%,rgba(235,240,255,.8) 0%,rgba(200,210,235,.5) 35%,rgba(160,175,210,0) 70%);filter:blur(14px)}
.c1{left:-180px;top:420px;width:640px;height:340px}
.c3{left:1980px;top:420px;width:720px;height:380px}
.c5{left:900px;top:520px;width:640px;height:240px;opacity:.3}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(46px)}}
@keyframes driftR{0%,100%{transform:translateX(0)}50%{transform:translateX(-40px)}}
.c1,.c5{animation:drift 4s ease-in-out infinite}
.c3{animation:driftR 4s ease-in-out infinite}

/* cupons pequenos subindo pelo fundo (entram e saem transparentes → laço sem emenda) */
.mini{position:absolute;width:96px;height:58px;border-radius:10px;opacity:0}
.mini::before,.mini::after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#161d2d;transform:translateY(-50%)}
.mini::before{left:-9px}.mini::after{right:-9px}
.mini::after{box-shadow:none}
.mini i{position:absolute;inset:7px;border:2px dashed rgba(0,0,0,.35);border-radius:6px}
.mo{background:#ff7a00}.mg{background:#ffd75a}.mw{background:#fff}
@keyframes rise{0%{transform:translateY(0) rotate(var(--r));opacity:0}15%{opacity:.85}80%{opacity:.85}100%{transform:translateY(-520px) rotate(calc(var(--r) + 40deg));opacity:0}}
.mini{animation:rise 4s linear infinite}

/* brilhos */
.sp{position:absolute;width:44px;height:44px;background:#fff6c9;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
@keyframes tw{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
.sp{animation:tw 2s ease-in-out infinite}

/* ---------- bloco central ---------- */
.mid{position:absolute;left:600px;width:1200px;top:0;height:600px;text-align:center}
.brand{position:absolute;left:0;right:0;top:6px;font-weight:800;font-size:150px;line-height:1;letter-spacing:-4px;color:#ff7a00;
  text-shadow:0 7px 0 #8a3a00,0 18px 34px rgba(0,0,0,.55);white-space:nowrap}
.lead{position:absolute;left:0;right:0;top:174px;font-weight:700;font-size:40px;opacity:.92}
.prize{position:absolute;left:0;right:0;top:206px;display:flex;justify-content:center;align-items:flex-start;
  filter:drop-shadow(0 7px 0 #7a4a06) drop-shadow(0 22px 36px rgba(0,0,0,.65))}
.prize span{font-weight:800;line-height:1;color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(100deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%),linear-gradient(180deg,#fff6c9 0%,#ffd75a 28%,#e9a91c 55%,#b8770b 78%,#ffd75a 100%);
  background-size:300% 100%,100% 100%;background-repeat:no-repeat}
.prize .cur{font-size:74px;margin:24px 12px 0 0;letter-spacing:-2px}
.prize .num{font-size:160px;letter-spacing:-3px}
.sub{position:absolute;left:0;right:0;top:376px;font-size:34px;font-weight:700}
.sub em{font-style:normal;color:#ffd75a}
.cta{position:absolute;left:50%;top:434px;transform:translateX(-50%);display:flex;align-items:center;gap:18px;white-space:nowrap;
  background:#ff6a00;color:#fff;font-weight:800;font-size:44px;border-radius:999px;padding:12px 16px 12px 44px;box-shadow:0 10px 26px rgba(255,106,0,.45)}
.cta i{display:flex;align-items:center;justify-content:center;width:58px;height:58px;border-radius:50%;background:#fff;color:#ff6a00;font-style:normal;font-size:44px;line-height:1;padding-bottom:5px}
.fine{position:absolute;left:0;right:0;top:548px;font-size:22px;font-weight:700;opacity:.6}

/* ---------- cupons grandes nas laterais ---------- */
.ticket{position:absolute;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:.9;text-align:center;overflow:hidden;
  box-shadow:0 18px 36px rgba(0,0,0,.45)}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:46px;height:46px;border-radius:50%;transform:translateY(-50%);background:#141a29}
.ticket::before{left:-23px}.ticket::after{right:-23px}
.ticket .in{position:absolute;inset:14px;border:4px dashed currentColor;border-radius:14px;opacity:.5}
.ticket b{font-size:96px;letter-spacing:-2px}
.ticket small{font-size:32px;letter-spacing:4px;margin-top:6px}
.ticket .shine{position:absolute;top:-20%;bottom:-20%;width:28%;left:-40%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent)}
.tA{left:90px;top:70px;width:380px;height:210px;background:#ff7a00;color:#fff}
.tB{left:150px;top:320px;width:400px;height:210px;background:#ffd75a;color:#3a2400}
.tC{left:1880px;top:64px;width:380px;height:210px;background:#fff;color:#ff6a00}
.tB b{font-size:70px;letter-spacing:-1px}

/* lingotes de ouro (SVG com 3 faces: topo, frente e lateral, carimbo 999,9 e reflexo passando) */
.gold{position:absolute;left:1890px;top:292px;width:440px;height:200px}
.gold svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 14px 18px rgba(0,0,0,.5))}
@keyframes sweep{0%,35%{transform:translateX(-160px)}75%,100%{transform:translateX(620px)}}
.gold .sweep{animation:sweep 4s ease-in-out infinite}
.halo{position:absolute;left:1880px;top:230px;width:480px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,60,.35),transparent 65%)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.gold{animation:float 4s ease-in-out infinite}

/* ---------- animação principal (laço de 4 s) ---------- */
@keyframes zA{0%,50%,100%{transform:rotate(-8deg) scale(1)}25%{transform:rotate(-2deg) scale(1.16)}}
@keyframes zB{0%,50%,100%{transform:rotate(6deg) scale(1)}25%{transform:rotate(0deg) scale(1.16)}}
@keyframes zC{0%,50%,100%{transform:rotate(8deg) scale(1)}25%{transform:rotate(2deg) scale(1.16)}}
@keyframes shine{0%{left:-40%}60%,100%{left:140%}}
@keyframes zBrand{0%,100%{transform:scale(1)}10%{transform:scale(1.06)}22%{transform:scale(1)}}
@keyframes zPrize{0%,30%{transform:scale(1)}42%{transform:scale(1.12)}56%,100%{transform:scale(1)}}
@keyframes gShine{0%,30%{background-position:0% 0,0 0}62%,100%{background-position:100% 0,0 0}}
@keyframes pulse{0%,74%{transform:translateX(-50%) scale(1);box-shadow:0 10px 26px rgba(255,106,0,.45)}84%{transform:translateX(-50%) scale(1.1);box-shadow:0 0 50px rgba(255,140,0,.9)}94%,100%{transform:translateX(-50%) scale(1);box-shadow:0 10px 26px rgba(255,106,0,.45)}}
@keyframes arrow{0%,40%,100%{transform:translateX(0)}20%{transform:translateX(10px)}}
.tA{animation:zA 4s ease-in-out infinite;z-index:3}
.tB{animation:zB 4s ease-in-out infinite;animation-delay:-2s;z-index:2}
.tC{animation:zC 4s ease-in-out infinite;animation-delay:-1s;z-index:3}
.ticket .shine{animation:shine 2s ease-in-out infinite}
.tB .shine{animation-delay:-1s}.tC .shine{animation-delay:-.5s}
.brand{animation:zBrand 4s ease-in-out infinite}
.prize{animation:zPrize 4s ease-in-out infinite;transform-origin:50% 55%}
.prize span{animation:gShine 4s ease-in-out infinite}
.cta{animation:pulse 4s ease-in-out infinite}
.cta i{animation:arrow 2s ease-in-out infinite}

/* ---------- CELULAR 1440×480 ---------- */
.m .rays{left:720px;top:200px}
.m .glow{left:270px;top:-140px;width:900px;height:600px}
.m .mid{left:330px;width:780px;height:480px}
.m .brand{top:18px;font-size:98px;letter-spacing:-3px;text-shadow:0 5px 0 #8a3a00,0 14px 26px rgba(0,0,0,.55)}
.m .lead{top:138px;font-size:30px}
.m .prize{top:168px}
.m .prize .cur{font-size:54px;margin:18px 8px 0 0}
.m .prize .num{font-size:118px;letter-spacing:-2px}
.m .sub{top:298px;font-size:26px}
.m .cta{top:352px;font-size:36px;padding:9px 12px 9px 34px}
.m .cta i{width:48px;height:48px;font-size:36px}
.m .fine{top:440px;font-size:17px}
.m .ticket{border-radius:16px}
.m .ticket::before,.m .ticket::after{width:30px;height:30px}
.m .ticket::before{left:-15px}.m .ticket::after{right:-15px}
.m .ticket .in{inset:9px;border-width:3px;border-radius:10px}
.m .ticket b{font-size:62px}.m .ticket small{font-size:21px;letter-spacing:3px}
.m .tB b{font-size:46px}
.m .tA{left:30px;top:46px;width:236px;height:140px}
.m .tB{left:56px;top:250px;width:260px;height:140px}
.m .tC{left:1170px;top:46px;width:236px;height:140px}
.m .gold{left:1108px;top:262px;transform-origin:0 0;scale:.7}
.m .halo{left:1100px;top:200px;width:360px;height:300px}
.m .c1{left:-220px;top:330px}.m .c3{left:1100px;top:340px;width:560px;height:320px}.m .c5{display:none}
</style></head>
<body>
<div class="b">
  <div class="glow"></div>
  <div class="rays"></div>
  <div class="cloud c5"></div>
  <div id="minis"></div>
  <div class="halo"></div>
  <div class="gold"><svg viewBox="0 0 500 200">
    <defs>
      <linearGradient id="gTop" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0" stop-color="#fff4c2"/><stop offset=".45" stop-color="#f7d46a"/><stop offset="1" stop-color="#e2ad2c"/></linearGradient>
      <linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f6cf5e"/><stop offset=".18" stop-color="#fbe49a"/><stop offset=".38" stop-color="#d9a024"/>
        <stop offset=".7" stop-color="#a86f0a"/><stop offset=".88" stop-color="#c88f1c"/><stop offset="1" stop-color="#7d5004"/></linearGradient>
      <linearGradient id="gSide" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#c58a16"/><stop offset=".5" stop-color="#8c5a06"/><stop offset="1" stop-color="#5e3b02"/></linearGradient>
      <linearGradient id="gStamp" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c99220"/><stop offset="1" stop-color="#f3cc62"/></linearGradient>
      <linearGradient id="gSweep" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <radialGradient id="gFloor" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
      <!-- um lingote: frente (trapézio inclinado), topo e lateral direita -->
      <g id="ingot">
        <path d="M0,108 L240,108 L216,46 L24,46 Z" fill="url(#gFront)"/>
        <path d="M24,46 L216,46 L238,22 L48,22 Z" fill="url(#gTop)"/>
        <path d="M216,46 L238,22 L262,84 L240,108 Z" fill="url(#gSide)"/>
        <path d="M24,46 L216,46" stroke="#fff8d8" stroke-width="2" opacity=".9"/>
        <path d="M216,46 L240,108" stroke="#ffe9a3" stroke-width="1.5" opacity=".6"/>
        <path d="M48,22 L238,22" stroke="#fffbe6" stroke-width="1.5" opacity=".7"/>
        <!-- carimbo gravado no topo -->
        <path d="M78,41 L168,41 L182,27 L92,27 Z" fill="url(#gStamp)" opacity=".85"/>
        <text x="128" y="39" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="12" fill="#7a4e05" transform="skewX(-40) translate(32,0)">999,9</text>
        <!-- gravação na frente -->
        <text x="120" y="84" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="17" letter-spacing="3" fill="#8a5a08" opacity=".75">FINE GOLD</text>
        <text x="120" y="85.5" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="17" letter-spacing="3" fill="#ffe6a0" opacity=".35">FINE GOLD</text>
      </g>
      <clipPath id="gClip">
        <path d="M0,184 L240,184 L216,122 L24,122 Z M24,122 L216,122 L238,98 L48,98 Z M216,122 L238,98 L262,160 L240,184 Z"/>
        <path transform="translate(228,0)" d="M0,184 L240,184 L216,122 L24,122 Z M24,122 L216,122 L238,98 L48,98 Z M216,122 L238,98 L262,160 L240,184 Z"/>
        <path transform="translate(114,0)" d="M0,114 L240,114 L216,52 L24,52 Z M24,52 L216,52 L238,28 L48,28 Z M216,52 L238,28 L262,90 L240,114 Z"/>
      </clipPath>
    </defs>
    <ellipse cx="250" cy="188" rx="260" ry="16" fill="url(#gFloor)"/>
    <use href="#ingot" transform="translate(0,76)"/>
    <use href="#ingot" transform="translate(228,76)"/>
    <use href="#ingot" transform="translate(114,6)"/>
    <g clip-path="url(#gClip)"><rect class="sweep" x="0" y="0" width="90" height="200" fill="url(#gSweep)" transform="translate(-160,0)" style="transform-box:view-box"/></g>
  </svg></div>

  <div class="ticket tA"><div class="in"></div><b>CUPOM</b><small>BLACK</small><i class="shine"></i></div>
  <div class="ticket tB"><div class="in"></div><b>PRÊMIOS</b><small>SEMANAIS</small><i class="shine"></i></div>
  <div class="ticket tC"><div class="in"></div><b>%OFF</b><small>CUPOM</small><i class="shine"></i></div>

  <div class="mid">
    <div class="brand">Black dos Sonhos</div>
    <div class="lead">Na Amazon, concorra a um prêmio de</div>
    <div class="prize"><span class="cur">R$</span><span class="num">1.000.000</span></div>
    <div class="sub">em certificados de barra de ouro <em>+ prêmios semanais</em></div>
    <div class="cta">Clique e concorra <i>›</i></div>
    <div class="fine">Promoção da Amazon. Consulte o regulamento no site.</div>
  </div>

  <div id="sparks"></div>
  <div class="cloud c1"></div><div class="cloud c3"></div>
</div>
<script>
const mob=new URLSearchParams(location.search).get('m')==='1';
if(mob)document.body.className='m';
// cupons pequenos: [x, y-inicial, cor, rotação, atraso(s)] — atrasos negativos espalham as fases no laço
const W=mob?1440:2400, H=mob?480:600, k=W/2400;
const M=[[560,640,'mo',-14,0],[680,660,'mg',10,-1.3],[1700,650,'mw',-8,-2.6],[1820,640,'mo',16,-.7],
         [420,670,'mg',-20,-3.3],[2000,660,'mo',12,-2],[330,650,'mg',8,-3.6],[2140,660,'mg',-12,-1.8]];
document.getElementById('minis').innerHTML=M.map(([x,y,c,r,d])=>
  `<div class="mini ${c}" style="left:${Math.round(x*k)}px;top:${y-(600-H)}px;--r:${r}deg;animation-delay:${d}s"><i></i></div>`).join('');
const S=[[620,120,44,0],[1770,150,44,-.7],[2320,40,44,-1.3],[1860,420,30,-.4],[560,330,30,-1.6],[1150,560,26,-1]];
document.getElementById('sparks').innerHTML=S.map(([x,y,s,d])=>
  `<div class="sp" style="left:${Math.round(x*k)}px;top:${Math.round(y*H/600)}px;width:${s}px;height:${s}px;animation-delay:${d}s"></div>`).join('');
</script>
</body></html>
